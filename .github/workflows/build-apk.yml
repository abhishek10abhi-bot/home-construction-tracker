name: Build Home Construction Tracker V2

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Extract V2 project
        run: |
          unzip -q Home_Construction_Tracker_V2_Native_Android_Project.zip -d extracted

      - name: Build APK
        working-directory: extracted/HomeConstructionTrackerV2
        run: |
          gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Home-Construction-Tracker-V2-APK
          path: extracted/HomeConstructionTrackerV2/app/build/outputs/apk/debug/app-debug.apk
